# 测试期：关掉 USB 键盘输出，插着电脑供电时按键也只走蓝牙发给手机
CONFIG_ZMK_USB=n

# 省电：闲置 15 分钟进深度睡眠，按键唤醒
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 向手机报电量
CONFIG_ZMK_BATTERY_REPORTING=y

# 手机端删除配对后允许直接重新配对（不用再刷清除固件）
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# 上一项会顺带开启"键盘输入配对码"，单键设备无法输入，必须关掉
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
